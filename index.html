<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ridge &amp; Run — Print Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="frontend/styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <span class="marks marks--tl" aria-hidden="true"></span>
    <h1 class="wordmark">Ridge &amp; Run</h1>
    <button id="cart-toggle" class="cart-toggle">
      Cart <span id="cart-count">0</span>
    </button>
    <span class="marks marks--tr" aria-hidden="true"></span>
  </div>
  <p class="wrap tagline">Trail-inspired goods, printed to order — nothing sits on a shelf until you buy it.</p>
</header>

<main class="wrap">
  <p id="mode-banner" class="mode-banner" hidden></p>
  <section id="product-grid" class="product-grid" aria-live="polite">
    <p class="loading">Loading catalog…</p>
  </section>
</main>

<aside id="cart-drawer" class="cart-drawer" aria-hidden="true">
  <div class="cart-drawer-inner">
    <div class="cart-drawer-head">
      <h2>Your cart</h2>
      <button id="cart-close" class="icon-btn" aria-label="Close cart">×</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-total-row">
      <span>Total</span>
      <span id="cart-total">$0.00</span>
    </div>
    <button id="checkout-open" class="btn btn-primary">Checkout</button>
  </div>
</aside>
<div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

<dialog id="checkout-modal">
  <form id="checkout-form" method="dialog">
    <h2>Shipping details</h2>
    <label>Full name <input required name="name" autocomplete="name" /></label>
    <label>Email <input required type="email" name="email" autocomplete="email" /></label>
    <label>Street address <input required name="address1" autocomplete="address-line1" /></label>
    <div class="field-row">
      <label>City <input required name="city" autocomplete="address-level2" /></label>
      <label>State/Region <input name="state_code" autocomplete="address-level1" placeholder="e.g. CA" /></label>
    </div>
    <div class="field-row">
      <label>ZIP/Postal <input required name="zip" autocomplete="postal-code" /></label>
      <label>Country code <input required name="country_code" autocomplete="country" placeholder="e.g. US" maxlength="2" /></label>
    </div>
    <p class="fine-print">Demo checkout — no payment is actually charged. In a live store, payment capture happens here before the order is sent to print.</p>
    <div class="modal-actions">
      <button type="button" id="checkout-cancel" class="btn">Cancel</button>
      <button type="submit" class="btn btn-primary">Place order</button>
    </div>
  </form>
</dialog>

<dialog id="confirm-modal">
  <div class="confirm-body">
    <h2>Order placed</h2>
    <p id="confirm-text"></p>
    <button id="confirm-close" class="btn btn-primary">Done</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
